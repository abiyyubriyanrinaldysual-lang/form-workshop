<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pendaftaran</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="form-card" aria-labelledby="page-title">
      <div class="eyebrow">PENDAFTARAN ONLINE</div>
      <h1 id="page-title">Buat akun pendaftaran</h1>
      <p class="intro">Lengkapi data di bawah ini untuk melanjutkan pendaftaran.</p>

      <div id="form-status" class="status" role="status" aria-live="polite" hidden></div>

      <form id="registration-form" novalidate>
        <div class="field">
          <label for="nama">Nama lengkap <span aria-hidden="true">*</span></label>
          <input id="nama" name="nama" type="text" placeholder="Contoh: Budi Santoso"
                 autocomplete="name" aria-describedby="nama-error">
          <small class="error" id="nama-error"></small>
        </div>

        <div class="field">
          <label for="email">Email <span aria-hidden="true">*</span></label>
          <input id="email" name="email" type="text" placeholder="nama@email.com"
                 autocomplete="email" inputmode="email" aria-describedby="email-error">
          <small class="error" id="email-error"></small>
        </div>

        <div class="field">
          <label for="telepon">Nomor HP <span aria-hidden="true">*</span></label>
          <input id="telepon" name="telepon" type="tel" placeholder="Contoh: 081234567890"
                 autocomplete="tel" inputmode="tel" aria-describedby="telepon-error">
          <small class="hint">Gunakan nomor Indonesia, misalnya 081234567890 atau 6281234567890.</small>
          <small class="error" id="telepon-error"></small>
        </div>

        <div class="field">
          <label for="tanggal">Tanggal pendaftaran <span aria-hidden="true">*</span></label>
          <input id="tanggal" name="tanggal" type="date" aria-describedby="tanggal-error">
          <small class="error" id="tanggal-error"></small>
        </div>

        <button type="submit">Daftar sekarang</button>
        <p class="required-note">* Wajib diisi</p>
      </form>
    </section>
    <footer>Form Pendaftaran · Validasi sisi klien dengan JavaScript</footer>
  </main>
</body>
</html>
